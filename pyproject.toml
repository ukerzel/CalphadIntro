[project]
name = "calphad-school-2026"
version = "0.1.0"
description = "Reproducible execution environment for the open CALPHAD transition"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pycalphad = "0.11.2"
espei = "0.9.1"
equilipy = "0.3.3"
numpy = "2.5.3"
scipy = "1.18.1"
sympy = "1.14.0"

[tool.poetry.group.atomistic]
optional = true

[tool.poetry.group.atomistic.dependencies]
ase = "3.29.0"
lammps = "2025.7.22.4.0"

[tool.poetry.group.dev.dependencies]
jupytext = "^1.19.6"
jupyterlab = "^4.6.4"
ipykernel = "^7.4.0"

[build-system]
requires = ["poetry-core>=2.1,<3"]
build-backend = "poetry.core.masonry.api"
